name: Build Seal Browser IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Seal Browser project
        run: |
          unzip -q SealBrowser-iOS-Source.zip -d ios-project
          ls -la ios-project

      - name: Build unsigned iPhone app
        working-directory: ios-project
        run: |
          set -euo pipefail

          xcodebuild \
            -project SealBrowser.xcodeproj \
            -scheme SealBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package IPA
        working-directory: ios-project
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SealBrowser.app Payload/SealBrowser.app
          zip -qry SealBrowser-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: SealBrowser-iPhone-IPA
          path: ios-project/SealBrowser-unsigned.ipa
