name: Build Seal Browser IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find and build Seal Browser
        run: |
          set -euo pipefail

          echo "Looking for SealBrowser.xcodeproj..."

          PROJECT_PATH="$(find . -name "SealBrowser.xcodeproj" -type d -print -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "Could not find SealBrowser.xcodeproj"
            find . -maxdepth 4 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"

          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          rm -rf build Payload SealBrowser-unsigned.ipa

          xcodebuild \
            -project SealBrowser.xcodeproj \
            -scheme SealBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

          APP_PATH="build/Build/Products/Release-iphoneos/SealBrowser.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "SealBrowser.app was not created."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/SealBrowser.app

          zip -qry SealBrowser-unsigned.ipa Payload

          mkdir -p "$GITHUB_WORKSPACE/ipa-output"
          cp SealBrowser-unsigned.ipa "$GITHUB_WORKSPACE/ipa-output/"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: SealBrowser-iPhone-IPA
          path: ipa-output/SealBrowser-unsigned.ipa
          if-no-files-found: error
