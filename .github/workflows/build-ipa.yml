name: Build Seal Browser IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract project
        run: |
          ZIP="$(find . -iname 'SealBrowser-iOS-Source*.zip' -print -quit)"

          if [ -n "$ZIP" ]; then
            echo "Found $ZIP"
            mkdir -p ios-project
            unzip -q "$ZIP" -d ios-project
          fi

      - name: Build Seal Browser
        run: |
          set -euo pipefail

          PROJECT_PATH="$(find . -name 'SealBrowser.xcodeproj' -type d -print -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "SealBrowser.xcodeproj not found"
            find . -maxdepth 5 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          cd "$PROJECT_DIR"

          xcodebuild \
            -project SealBrowser.xcodeproj \
            -scheme SealBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SealBrowser.app Payload/

          zip -qry SealBrowser-unsigned.ipa Payload

          mkdir -p "$GITHUB_WORKSPACE/ipa-output"
          cp SealBrowser-unsigned.ipa "$GITHUB_WORKSPACE/ipa-output/"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: SealBrowser-iPhone-IPA
          path: ipa-output/SealBrowser-unsigned.ipa
