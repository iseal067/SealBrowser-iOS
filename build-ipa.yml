name: Build Seal Browser IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          rm -rf build Payload SealBrowser-unsigned.ipa
          xcodebuild \
            -project SealBrowser.xcodeproj \
            -scheme SealBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/SealBrowser.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/SealBrowser.app
          /usr/bin/zip -qry SealBrowser-unsigned.ipa Payload
          ls -lh SealBrowser-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: SealBrowser-iPhone-IPA
          path: SealBrowser-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
